specVersion: 1.3.0
description: Raw FreelanceEscrow event log for FreelanceTrail — indexed by The Graph
  instead of polling Arc Testnet's rate-limited public RPC directly.
repository: https://github.com/Wilfred007/FreelanceTrail
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: FreelanceEscrow
    network: arc-testnet
    source:
      address: "0x26C85d7290A61CD92064168f8Fc1E09EC8f2BcaD"
      abi: FreelanceEscrow
      startBlock: 60440102
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ProjectCreatedEvent
        - MilestoneFundedEvent
        - MilestoneSubmittedEvent
        - MilestoneApprovedEvent
        - PaymentReleasedEvent
        - RefundIssuedEvent
      abis:
        - name: FreelanceEscrow
          file: ./abis/FreelanceEscrow.json
      eventHandlers:
        - event: ProjectCreated(indexed uint256,indexed address,indexed address,string,uint256[])
          handler: handleProjectCreated
        - event: MilestoneFunded(indexed uint256,indexed uint256,uint256)
          handler: handleMilestoneFunded
        - event: MilestoneSubmitted(indexed uint256,indexed uint256,string)
          handler: handleMilestoneSubmitted
        - event: MilestoneApproved(indexed uint256,indexed uint256)
          handler: handleMilestoneApproved
        - event: PaymentReleased(indexed uint256,indexed uint256,indexed address,uint256)
          handler: handlePaymentReleased
        - event: RefundIssued(indexed uint256,indexed uint256,indexed address,uint256)
          handler: handleRefundIssued
      file: ./src/mapping.ts
